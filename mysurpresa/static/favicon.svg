  <path d="M55 6.5l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#dc3545"/>
  <path d="M32 6l1.3 3.3 3.3 1.3-3.3 1.3L32 15.2l-1.3-3.3-3.3-1.3 3.3-1.3z" fill="#dc3545"/>
