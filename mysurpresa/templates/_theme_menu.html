{# The theme menu, as in myguro: one button per theme (theme.js marks the chosen one). #}
<div class="dropdown">
  <button class="btn btn-outline-secondary btn-sm bi bi-circle-half" type="button" data-bs-toggle="dropdown"
          aria-expanded="false" aria-label="Change theme" title="Change theme"></button>
  <ul class="dropdown-menu dropdown-menu-end">
    <li><h6 class="dropdown-header">Theme</h6></li>
    {% for value, label in (("auto", "Auto"), ("light", "Light"), ("dark", "Dark")) %}
    <li><button class="dropdown-item" type="button" data-theme-choice="{{ value }}">{{ label }}</button></li>
    {% endfor %}
  </ul>
</div>
