<div class="modal fade" id="item-modal" tabindex="-1" aria-labelledby="item-modal-title" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="item-form" novalidate>
      <div class="modal-header">
        <h2 class="modal-title h5" id="item-modal-title">Add item</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="small text-body-secondary">Next you can add its photos. It stays a draft (hidden from the shop) until you set it to Available.</p>
        <div class="mb-3">
          <label class="form-label" for="item-name">Name</label>
          <input class="form-control" id="item-name" maxlength="100" required placeholder="e.g. Nike running shoes, size 9">
        </div>
        <div class="mb-3">
          <label class="form-label" for="item-price">Price (₱)</label>
          <input class="form-control" id="item-price" type="number" min="0" step="0.01" inputmode="decimal" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="item-parcel">Parcel</label>
          <select class="form-select" id="item-parcel" data-parcel-select>
            <option value="">No parcel</option>
          </select>
        </div>
        <div id="item-error" class="alert alert-danger py-2 mb-0 d-none" role="alert"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary bi bi-arrow-right" id="item-save">Add and add photos</button>
      </div>
    </form>
  </div>
</div>
