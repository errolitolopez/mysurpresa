<!doctype html>
<!-- data-style="neu": the neumorphic look from myguro, always on (see glass.css).
     data-bs-theme="light": light mode only for now. The dark colours are still in glass.css, for later. -->
<html lang="en" data-style="neu" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MySurpresa{% endblock %}</title>
  {# Link previews on Facebook and Messenger read these og: tags (title, photo, text). #}
  {% block head %}{% endblock %}
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg', v=2) }}" type="image/svg+xml">
  <meta name="theme-color" content="#4f46e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+"
        crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glass.css', v=4) }}">
</head>
<body class="d-flex flex-column min-vh-100">
  {% block content %}{% endblock %}

  <footer class="container py-3 mt-auto text-center small text-body-secondary">
    {% block footer %}{% endblock %}
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
